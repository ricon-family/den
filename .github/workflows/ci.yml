name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  codebase-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run configured codebase lints
        env:
          MISE_JOBS: 1
        run: |
          set -euo pipefail
          mise trust
          mise install
          codebase lint "$PWD"
